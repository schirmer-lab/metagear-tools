name: Release

on:
  push:
    tags:
      # Bare and date-based, matching the tags this repo actually uses: 26.09, and
      # 26.09.1 for a fix within the same month. The previous 'v*.*.*' matched neither
      # the absent v prefix nor the two-component form, so this workflow had never run.
      - '[0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9].[0-9][0-9].[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog entry
        id: changelog
        run: |
          # Extract the changelog entry for this version
          VERSION=${GITHUB_REF#refs/tags/}
          # Get the section between this version and the next one
          CHANGELOG_ENTRY=$(awk "/^## \[${VERSION#v}\]/{flag=1; next} /^## \[/{flag=0} flag {print}" CHANGELOG.md)

          # If changelog entry is empty, use a default message
          if [ -z "$CHANGELOG_ENTRY" ]; then
            CHANGELOG_ENTRY="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi

          # Save to output (handling multiline)
          {
            echo 'RELEASE_NOTES<<EOF'
            echo "$CHANGELOG_ENTRY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, never interpolated into the script. The changelog is
          # full of `backticked` flag names, and inside a double-quoted shell string those
          # are command substitutions: the body would arrive with every code span executed
          # and blanked out. It is also untrusted input as far as the shell is concerned.
          RELEASE_NOTES: ${{ steps.changelog.outputs.RELEASE_NOTES }}
          TAG: ${{ github.ref_name }}
        run: |
          # github.event.before is all zeros when a push creates a new ref, so the compare
          # link it used to build never resolved. Derive the previous tag instead, and omit
          # the link when there is none. fetch-depth 0 above makes the tags available.
          prev_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## What's Changed"
            echo
            printf '%s\n' "$RELEASE_NOTES"
            if [ -n "$prev_tag" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${TAG}"
            fi
          } > "${RUNNER_TEMP}/release_notes.md"

          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file "${RUNNER_TEMP}/release_notes.md" \
            --draft=false \
            --prerelease=false
