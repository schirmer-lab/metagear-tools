# The machines this site runs MetaGEAR across, one per line.
#
#   label | ssh target | scratch root | scratch slots | db mirror
#
# label          what the node is called in `metagear cluster status`, and the HyperQueue
#                resource used to steer a process at it by name.
# ssh target     user@host for a remote node, or "-" for the machine the server runs on.
# scratch root   where tasks stage their work on that node's own disk. This is the whole
#                reason for a second node: across the kch cohorts the tasks moved 1,314 TB
#                while the real data was ~960 GB in and ~890 GB out, so >99.8% of it is
#                intermediates that never need to cross the network.
# scratch slots  how many `diskio` tasks may run there at once. This is rationing, not
#                pinning: every node carries the resource, so the heavy-I/O processes run
#                anywhere — what differs is how many at a time. Give a node with a big fast
#                array a very large number, and cap one whose scratch disk is small and
#                shared. HyperQueue has no soft placement, so a real pin would mean "only
#                there", and a phase of only-pinned work leaves every other node idle.
# db mirror      root of a local path-for-path copy of the reference databases, or "-" for a
#                node that reads them over the network. Build one with mirror-dbs.sh.
#
# Order matters: HyperQueue offers work to the first-registered worker before the others, so
# list the machine you want to get first refusal first.
#
# A single-machine site needs only the one line, and can leave the mirror off:
#
#   local|-|/scratch/metagear|1000000|-
#
# A two-node example, the shape this was built against:
#
#   big|-|/localssd/scratch/metagear|8|-
#   roomy|user@10.0.0.11|/data/scratch/metagear|1000000|/data/db
